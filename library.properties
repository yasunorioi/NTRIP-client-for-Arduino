sentence=NTRIP client for ESP32 with NVS-persisted config and optional captive-portal Web UI.
paragraph=Receives RTCM3 from an NTRIP caster. Includes a NTRIPConfig (NVS-persisted settings) layer and an optional NTRIPConfigPortal (AsyncWebServer captive portal) for runtime reconfiguration. The portal is opt-in: only sketches that #include "NTRIPConfigPortal.h" require the ESPAsyncWebServer + AsyncTCP libraries.
category=Communication
