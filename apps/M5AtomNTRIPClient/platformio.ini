; M5Atom NTRIP Client - PlatformIO 設定
;
; VSCode + PlatformIO IDE でビルド・書き込み・シリアルモニタを実行する。
; src_dir をルートにしているので、.ino はそのまま Arduino IDE でも使える。

[platformio]
src_dir = .

[env:m5stack-atom]
platform      = espressif32
board         = m5stack-atom
framework     = arduino
monitor_speed = 115200
upload_speed  = 1500000

lib_deps =
    m5stack/M5Atom
    tzapu/WiFiManager
    ; NTRIPClient はこのリポジトリ直下 (../..) のライブラリを参照する
    symlink://../..

build_flags =
    -DCORE_DEBUG_LEVEL=0
