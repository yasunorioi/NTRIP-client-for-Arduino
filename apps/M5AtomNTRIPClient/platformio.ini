; M5Atom NTRIP Client - PlatformIO 設定
;
; VSCode + PlatformIO IDE でビルド・書き込み・シリアルモニタを実行する。
; src_dir をルートにしているので、.ino はそのまま Arduino IDE でも使える。

[platformio]
src_dir = .

[env:m5stack-atom]
platform      = espressif32
board         = m5stack-atom
framework     = arduino
monitor_speed = 115200
upload_speed  = 1500000

lib_deps =
    m5stack/M5Atom
    fastled/FastLED        ; M5Atom.h が内部で <FastLED.h> を読み込むため必須
    tzapu/WiFiManager
    ; NTRIPClient はこのリポジトリ直下 (../..) のライブラリを参照する
    symlink://../..

build_flags =
    -DCORE_DEBUG_LEVEL=0
    ; CI からは PLATFORMIO_BUILD_FLAGS で git tag で上書きされる
    -DFIRMWARE_VERSION='"dev"'
