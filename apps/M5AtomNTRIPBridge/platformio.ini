; M5Atom NTRIP Bridge - PlatformIO 設定
;
; VSCode + PlatformIO IDE でビルド・書き込み・シリアルモニタを実行する。
; src_dir をルートにしているので、.ino はそのまま Arduino IDE でも使える。

[platformio]
src_dir = .

[env:m5stack-atom]
platform      = espressif32
board         = m5stack-atom
framework     = arduino
monitor_speed = 115200
upload_speed  = 1500000

; M5Atom Grove ポート (G22/G19) を Serial2 に使うため、
; ピン番号がそのまま .ino 内のリテラルで通る Arduino フレームワークを使用。

lib_deps =
    m5stack/M5Atom
    fastled/FastLED
    tzapu/WiFiManager
    ; 設定ポータル用 (ESP32Async fork: 最新ESP32 Arduinoコアで動く現役メンテ版)
    https://github.com/ESP32Async/AsyncTCP.git
    https://github.com/ESP32Async/ESPAsyncWebServer.git
    ; NTRIPClient はこのリポジトリ直下 (../..) のライブラリを参照する
    symlink://../..

build_flags =
    -DCORE_DEBUG_LEVEL=0
