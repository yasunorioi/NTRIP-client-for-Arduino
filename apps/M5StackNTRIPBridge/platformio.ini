; M5Stack Basic NTRIP Bridge - PlatformIO 設定
;
; VSCode + PlatformIO IDE でビルド・書き込み・シリアルモニタを実行する。
; src_dir をルートにしているので、.ino はそのまま Arduino IDE でも使える。

[platformio]
src_dir = .

[env:m5stack-core-esp32]
platform      = espressif32
board         = m5stack-core-esp32
framework     = arduino
monitor_speed = 115200
upload_speed  = 1500000

; min_spiffs.csv: app=1.9MB / ota_0=1.9MB / spiffs=190KB。HTTPClient +
; WiFiClientSecure (mbedtls) + AsyncWebServer のサイズに余裕を持たせ、
; 将来の OTA も同 partition table で対応可能。
; 注: 既存デバイスへの初回フラッシュ時は flash 全消去 (esptool.py erase_flash) が必要。
board_build.partitions = min_spiffs.csv

; PORT.A (G21/G22)        = RTK 受信機との双方向 (RTCM out + NMEA in) → Serial2
; RS232F Module (G16/G17) = NMEA を DB9 経由で外部へ → UART1
; ESP32 の UART2 のデフォルトは 16/17 だが、ピン指定で 21/22 に振り替える。

lib_deps =
    m5stack/M5Unified
    tzapu/WiFiManager
    ; 設定ポータル用 (ESP32Async fork: 最新ESP32 Arduinoコアで動く現役メンテ版)
    https://github.com/ESP32Async/AsyncTCP.git
    https://github.com/ESP32Async/ESPAsyncWebServer.git
    ; NTRIPClient はこのリポジトリ直下 (../..) のライブラリを参照する
    symlink://../..

build_flags =
    -DCORE_DEBUG_LEVEL=0
    ; CI からは PLATFORMIO_BUILD_FLAGS で git tag で上書きされる
    -DFIRMWARE_VERSION='"dev"'
