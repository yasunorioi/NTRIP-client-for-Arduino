; M5Stack Basic NTRIP Client - PlatformIO 設定
;
; VSCode + PlatformIO IDE でビルド・書き込み・シリアルモニタを実行する。
; src_dir をルートにしているので、.ino はそのまま Arduino IDE でも使える。

[platformio]
src_dir = .

[env:m5stack-core-esp32]
platform      = espressif32
board         = m5stack-core-esp32
framework     = arduino
monitor_speed = 115200
upload_speed  = 1500000

; min_spiffs.csv: app=1.9MB / ota_0=1.9MB / ota_1=0 (実質app+spiffsのみ) ではなく
; Arduino-ESP32 同梱の min_spiffs は app 1.9MB + ota_0 1.9MB + spiffs 190KB。
; HTTPClient + WiFiClientSecure (mbedtls) を抱えるサイズに余裕を持たせ、将来の
; OTA も同 partition table で対応可能にする。
; 注: 既存デバイスへの初回フラッシュ時は flash 全消去 (esptool.py erase_flash) が必要。
board_build.partitions = min_spiffs.csv

; PORT.A (G21/G22) を Serial2 に割り当てて RTCM3 を RTK 受信機へ送る。
; ピン番号は .ino 内のリテラルでそのまま通る Arduino フレームワークを使用。

lib_deps =
    m5stack/M5Unified
    tzapu/WiFiManager
    ; NTRIPClient はこのリポジトリ直下 (../..) のライブラリを参照する
    symlink://../..

build_flags =
    -DCORE_DEBUG_LEVEL=0
    ; CI からは PLATFORMIO_BUILD_FLAGS で git tag で上書きされる
    -DFIRMWARE_VERSION='"dev"'
